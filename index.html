<!DOCTYPE html>
<html>
<head>
  <title>Iuran Maestro FKSSB 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background:#000; color:#fff; text-align:center; }
    form, .card { margin:10px auto; width:90%; max-width:400px; }
    .card { border:1px solid red; padding:10px; border-radius:8px; }
    .lunas { background:#ccffcc; }
    .belum { background:#ffcccc; }
    button { margin:6px; padding:6px 12px; border:none; border-radius:5px; cursor:pointer; }
    .export-btn { background:red; color:#fff; font-weight:bold; }
    .rekap { margin-top:10px; font-weight:bold; }
  </style>
</head>
<body>
  <h2>Form Input Iuran</h2>
  <form id="iuranForm">
    <input id="nama" placeholder="Nama Pemain" required><br>
    <select id="usia"><option>9</option><option>10</option><option>12</option></select><br>
    <input id="iuran" type="number" placeholder="Jumlah Iuran" required><br>
    <select id="status"><option>Lunas</option><option>Belum</option></select><br>
    <button type="submit">Simpan</button>
  </form>

  <h3>Data Iuran</h3>
  <label for="filterUsia">Filter Usia:</label>
  <select id="filterUsia" onchange="showData()">
    <option value="all">Semua</option>
    <option value="9">9</option>
    <option value="10">10</option>
    <option value="12">12</option>
  </select>
  <div id="laporan"></div>
  <div id="rekap" class="rekap"></div>
  <button class="export-btn" onclick="exportCSV()">Export ke CSV</button>

  <script>
    const form = document.getElementById("iuranForm");

    form.addEventListener("submit", e => {
      e.preventDefault();
      const data = JSON.parse(localStorage.getItem("iuranData")) || [];
      data.push({
        nama: document.getElementById("nama").value,
        usia: document.getElementById("usia").value,
        iuran: parseInt(document.getElementById("iuran").value),
        status: document.getElementById("status").value
      });
      localStorage.setItem("iuranData", JSON.stringify(data));
      showData();
      form.reset();
    });

    function showData() {
      const data = JSON.parse(localStorage.getItem("iuranData")) || [];
      const filter = document.getElementById("filterUsia").value;
      const laporan = document.getElementById("laporan");
      const rekap = document.getElementById("rekap");
      laporan.innerHTML = "";
      let total = 0;
      let count = 0;

      data.forEach(d => {
        if(filter==="all" || d.usia===filter){
          const div = document.createElement("div");
          div.className = "card " + (d.status==="Lunas"?"lunas":"belum");
          div.innerHTML = `${d.nama} (Usia ${d.usia}) - Rp ${d.iuran} - ${d.status}`;
          laporan.appendChild(div);
          total += d.iuran;
          count++;
        }
      });

      rekap.innerHTML = `Total Iuran (${filter==="all"?"Semua Usia":"Usia "+filter}): Rp ${total} dari ${count} pemain`;
    }

    function exportCSV() {
      const data = JSON.parse(localStorage.getItem("iuranData")) || [];
      const filter = document.getElementById("filterUsia").value;
      let filtered = data.filter(d => filter==="all" || d.usia===filter);
      if(filtered.length === 0) { alert("Tidak ada data untuk diexport"); return; }
      let csv = "Nama,Usia,Iuran,Status\n";
      filtered.forEach(d => {
        csv += `${d.nama},${d.usia},${d.iuran},${d.status}\n`;
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "laporan_iuran.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = showData;
  </script>
</body>
</html>
